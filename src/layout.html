<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="https://divert.ly{{path}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{og_description}}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://divert.ly{{path}}" />
  <meta property="og:site_name" content="Divertly" />
  <meta property="og:image" content="https://divert.ly/img/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Divertly: Programmable link routing. One link, many destinations, controlled by API." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{og_description}}" />
  <meta name="twitter:image" content="https://divert.ly/img/og.png" />
  <link rel="icon" type="image/svg+xml" href="/img/arrow.svg" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/cal-sans-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/bootstrap-icons.css" />
  <link rel="stylesheet" href="/css/site.css" />
{{extra_head}}
</head>

<body data-page="{{slug}}">
{{header}}
  <main id="main">
{{content}}
  </main>
{{footer}}
  <script src="/js/site.js" defer></script>
  <script src="/js/consent.js" defer></script>
{{extra_body}}
</body>

</html>
